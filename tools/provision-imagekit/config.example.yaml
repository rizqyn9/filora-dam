# ImageKit provisioning tool configuration

# Email domain for generating accounts (Cloudflare catch-all)
email_domain: "img.yourdomain.com"

# Password used for all ImageKit accounts
# Must meet: 8-100 chars, 1 lowercase, 1 uppercase, 1 digit
password: "MyStr0ngPass!"

# Name used for registration
name: "Filora Storage"

# How many accounts to provision in this run
batch_size: 5

# Storage region (as shown in ImageKit dropdown)
region: "Singapore (Singapore)"

# CapSolver API key for auto-solving captcha (optional, paid fallback)
# Get one at https://capsolver.com — ~$2/1000 solves
capsolver_api_key: ""

# Google Cloud Speech-to-Text API key for Buster reCAPTCHA audio solver
# Used by the Buster extension to transcribe audio challenges
# Get one at https://console.cloud.google.com/apis/credentials
google_stt_api_key: ""
