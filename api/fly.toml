app = "filora-api"
primary_region = "sin"  # Singapore (closest to Neon ap-southeast-1)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[deploy]
  strategy = "immediate"

[[vm]]
  count = 1
  size = "shared-cpu-1x"
  memory = "256mb"
