version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rizqyn9/filora-dam

linters:
  enable:
    # Bugs
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - bodyclose
    - nilerr

    # Style & simplicity
    - unused
    - gocritic
    - misspell
    - unconvert
    - unparam

    # Security
    - gosec

    # Performance
    - prealloc

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam

  gosec:
    excludes:
      - G104
      - G304

  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  exclude-dirs:
    - internal/database/db
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
